# Publish both packages to npm on a version tag.
#
# TRUSTED PUBLISHING -- there is deliberately no NPM_TOKEN here.
#
# npm trusted publishing is configured for @11ai/execution-governance and
# @11ai/mcp-gate and is bound to THIS FILE by path. Two consequences:
#
#   1. The filename must stay exactly `.github/workflows/release.yml`.
#      Renaming or moving it breaks the binding and every publish fails.
#   2. An NPM_TOKEN would be rejected. Do not add one, and do not "fix" a
#      failing publish by adding one.
#
# WHY PUBLISHING LIVES HERE AT ALL
#
# 0.3.0, 0.4.0 and 0.4.1 were published by hand. No tag exists for any of them,
# so this workflow never ran, and neither did npm ci, lint, the test suite or
# the tarball check. 0.4.0 was public at 23:47:51Z; the first check on that code
# started at 23:50:31Z and went red on the defect that was already published.
# The gate was never broken. It was never consulted.
#
# It is also what produces the npm provenance attestation: a verifiable link
# from the published tarball back to this commit and this workflow, checkable by
# a third party without asking us. For a package whose entire argument is that
# you should not have to take our word for it, a hand-published artifact with
# nothing but our word behind it was the wrong shape.
#
# THE GATE SET IS ALL-OR-NOTHING
#
# `publish` needs every gate job. A skipped job is not a passing job: in the
# 0.4.0 run, `npm ci` failed first and `verify-tarball.sh` was SKIPPED, so the
# tarball check had no verdict at all and an "it didn't fail" reading would have
# been wrong. `gates-green` below inspects each result and refuses on anything
# that is not literally success, naming which it was.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Does this release make sense before we spend anything on it?
  # --------------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    outputs:
      gate_publish: ${{ steps.gate.outputs.should_publish }}
      mcp_publish: ${{ steps.mcp.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # Fail before anything is published if the tag and the manifests
      # disagree. Publishing package A at the tagged version and then finding
      # package B is stale leaves a half-released pair that cannot be
      # unpublished after 72 hours. This FAILS the workflow, it does not warn.
      - name: Tag must match both package versions
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          for p in packages/gate packages/mcp-gate; do
            V="$(node -p "require('./$p/package.json').version")"
            N="$(node -p "require('./$p/package.json').name")"
            if [ "$V" != "$TAG" ]; then
              echo "::error::$N is $V but the tag is v$TAG"
              exit 1
            fi
            echo "ok: $N@$V matches tag v$TAG"
          done

      # THE FOOT-GUN GUARD.
      #
      # This workflow fires on any v* tag, and no tags exist for 0.3.0, 0.4.0 or
      # 0.4.1. Pushing v0.4.1 to tidy the record would start a release of a
      # version that is already public. A version already on the registry is a
      # CLEAN NO-OP here: the workflow succeeds and publishes nothing.
      #
      # The script fails closed. "The registry did not answer" is not "the
      # version is absent", and treating it as absent is how you publish twice.
      - name: Is this version already on the registry?
        id: gate
        run: node scripts/check-registry-version.mjs packages/gate
      - name: Is the mcp-gate version already on the registry?
        id: mcp
        run: node scripts/check-registry-version.mjs packages/mcp-gate

  # --------------------------------------------------------------------------
  # The gates. Same checks a pull request gets, re-run here, because a tag is
  # not evidence that CI passed on this commit.
  # --------------------------------------------------------------------------
  gate-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  gate-tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      # Packs, inspects the tarball's own manifest for a self-dependency,
      # installs it outside the workspace and asserts nothing is nested.
      - run: bash scripts/verify-tarball.sh

  # --------------------------------------------------------------------------
  # Every gate must have SUCCEEDED. Not "not failed".
  # --------------------------------------------------------------------------
  gates-green:
    runs-on: ubuntu-latest
    needs: [preflight, gate-test, gate-tarball]
    # always(), so that a failed or skipped gate produces a log line naming it
    # rather than this job being skipped in silence too.
    if: always()
    steps:
      - name: No gate may be anything but success
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS);
            const bad = [];
            for (const [name, j] of Object.entries(needs)) {
              const r = j.result;
              if (r === "success") { console.log(`ok: ${name} succeeded`); continue; }
              const why = {
                failure:  "FAILED",
                cancelled:"was CANCELLED",
                skipped:  "was SKIPPED, which is not the same as passing: it never ran",
              }[r] ?? `reported an unrecognised result: ${r}`;
              bad.push(`${name} ${why}`);
            }
            if (bad.length) {
              console.error("::error::Refusing to publish. Not every gate succeeded:");
              for (const b of bad) console.error(`  - ${b}`);
              process.exit(1);
            }
            console.log("every gate succeeded");
          '

  # --------------------------------------------------------------------------
  # Publish. Reached only when every gate succeeded AND the version is new.
  # --------------------------------------------------------------------------
  publish:
    runs-on: ubuntu-latest
    needs: [preflight, gates-green]
    permissions:
      contents: read
      id-token: write # required: this is what trusted publishing authenticates with
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, newer than the npm bundled with
      # Node 20. PINNED TO A MAJOR ON PURPOSE: this step was `npm@latest` and it
      # broke the first release, when npm 12 raised its floor to Node ^22.22 and
      # the runner was on Node 20. `@latest` in a release workflow is an
      # unpinned dependency that can only fail while you are cutting a release,
      # and it moves on npm's schedule rather than yours.
      - name: Install npm with trusted-publishing support
        run: |
          npm install -g npm@^11
          NPM_V="$(npm --version)"
          echo "npm $NPM_V on node $(node --version)"
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error(`::error::npm ${process.argv[1]} is below 11.5.1, which trusted publishing requires`);
              process.exit(1);
            }
            console.log("npm supports trusted publishing");
          ' "$NPM_V"

      - run: npm ci
      - run: npm run build

      # Published in dependency order: mcp-gate depends on the gate SDK, so the
      # SDK must exist at the new version first.
      #
      # --provenance is passed explicitly rather than relying on it being
      # implied by trusted publishing, so that a change in that default cannot
      # silently drop the attestation. Both the repository and the packages are
      # public, which provenance requires.
      - name: Publish @11ai/execution-governance
        if: needs.preflight.outputs.gate_publish == 'true'
        run: npm publish --provenance
        working-directory: packages/gate

      - name: Publish @11ai/mcp-gate
        if: needs.preflight.outputs.mcp_publish == 'true'
        run: npm publish --provenance
        working-directory: packages/mcp-gate

      - name: Nothing to publish
        if: needs.preflight.outputs.gate_publish != 'true' && needs.preflight.outputs.mcp_publish != 'true'
        run: echo "Both versions are already on the registry. Published nothing. This is a clean no-op."

  # --------------------------------------------------------------------------
  # Does what we just published actually work, installed the way a user gets it?
  # --------------------------------------------------------------------------
  post-publish:
    needs: [publish]
    uses: ./.github/workflows/post-publish.yml
