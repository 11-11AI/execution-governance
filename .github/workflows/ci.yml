name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 24 is here because release.yml publishes on Node 24. Publishing from
        # a runtime nothing tests is how a release ships a failure that every
        # green check missed. 18 stays because `engines` still claims >=18, and
        # dropping it from the matrix without changing `engines` would be a
        # support claim with nothing behind it.
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the release runtime, so the tarball this job verifies is
          # built the same way as the one that actually gets published.
          node-version: "24"
      - run: npm ci
      - run: bash scripts/verify-tarball.sh

  docs:
    # docs/VECTORS.md, and the count in the README, are both generated from the
    # red-team fixture and the starter policy. This job regenerates them and
    # fails on a diff, so neither can drift from the vectors it reports: a new
    # vector, a renamed tool, or an edited reason string that is not reflected
    # stops the merge rather than quietly publishing a number that is no longer
    # true. The README count is the one that used to be typed by hand.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run gen:vectors
      - name: The generated vector docs are up to date
        run: |
          if ! git diff --quiet -- docs/VECTORS.md README.md; then
            echo "Generated vector docs are stale. Regenerate with: npm run gen:vectors"
            git --no-pager diff -- docs/VECTORS.md README.md
            exit 1
          fi
          echo "docs/VECTORS.md and the README count match the fixtures"

  verify-page:
    # docs/verify/index.html reimplements the verification path in a browser,
    # against a different crypto stack, from a file:// URL. The Node suite cannot
    # reach any of that. A browser verifier that disagrees with eg-verify is
    # worse than no browser verifier, because it disagrees exactly where the
    # answer matters, so one of these tests asserts agreement with the CLI on the
    # same bytes rather than only asserting the page looks right.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
