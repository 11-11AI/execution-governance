name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 24 is here because release.yml publishes on Node 24. Publishing from
        # a runtime nothing tests is how a release ships a failure that every
        # green check missed. 18 stays because `engines` still claims >=18, and
        # dropping it from the matrix without changing `engines` would be a
        # support claim with nothing behind it.
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the release runtime, so the tarball this job verifies is
          # built the same way as the one that actually gets published.
          node-version: "24"
      - run: npm ci
      - run: bash scripts/verify-tarball.sh

  docs:
    # docs/VECTORS.md is generated from the red-team fixture and the starter
    # policy. This job regenerates it and fails on a diff, so the page cannot
    # drift from the vectors it reports: a new vector, a renamed tool, or an
    # edited reason string that is not reflected in the page stops the merge
    # rather than quietly publishing a number that is no longer true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run gen:vectors
      - name: docs/VECTORS.md is up to date
        run: |
          if ! git diff --quiet -- docs/VECTORS.md; then
            echo "docs/VECTORS.md is stale. Regenerate it with: npm run gen:vectors"
            git --no-pager diff -- docs/VECTORS.md
            exit 1
          fi
          echo "docs/VECTORS.md matches the fixtures"
